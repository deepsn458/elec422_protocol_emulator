name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make can return success even if cocotb reports a failure.
          ! grep failure ../sim_outputs/rtl/cocotb/results.xml

      - name: Run SystemVerilog test
        run: make -C test FLOW=sv

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: |
            sim_outputs/rtl/cocotb/results.xml
            sim_outputs/modules/cocotb/*/results.xml
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            sim_outputs/
